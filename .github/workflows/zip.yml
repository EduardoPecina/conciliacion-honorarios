name: ZIP con rutas largas
on: [push, pull_request]
permissions:
  contents: read
jobs:
  zip:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install pandas openpyxl
      - run: python -m unittest discover -s tests -p test_zip_largo.py -v
